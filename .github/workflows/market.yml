name: Market pipeline
# GitHub skips many scheduled runs (about 4 a day in practice), so nothing here may need to run hourly: the
# Worker's cron samples kills and jumps itself (worker/index.js sampleActivity).
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: market-pipeline
  cancel-in-progress: false
jobs:
  scan:
    name: Aggregate ESI market data
    if: github.ref == 'refs/heads/main'
    environment: github-pages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Scan markets and upload to the Worker
        env:
          # PIPELINE_SECRET signs the uploads once it exists (worker/README.md); EVE_CLIENT_SECRET is the legacy fallback.
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
          EVE_CLIENT_SECRET: ${{ secrets.EVE_CLIENT_SECRET }}
        run: node scripts/market-pipeline.mjs
