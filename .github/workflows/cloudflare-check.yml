name: Check Cloudflare connection
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/cloudflare-check.yml
      - scripts/check-cloudflare.mjs
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate configured secrets and account access
        env:
          CONFIGURED_SECRETS: ${{ toJSON(secrets) }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVE_CLIENT_SECRET: ${{ secrets.EVE_CLIENT_SECRET }}
        run: node scripts/check-cloudflare.mjs
