name: Check Cloudflare connection
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/cloudflare-check.yml
      - scripts/check-cloudflare.mjs
permissions:
  contents: read
jobs:
  check:
    # The github-pages environment holds the secrets: only main may use it (also set a branch rule on the environment).
    if: github.ref == 'refs/heads/main'
    environment: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Validate configured secrets and account access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVE_CLIENT_SECRET: ${{ secrets.EVE_CLIENT_SECRET }}
        run: node scripts/check-cloudflare.mjs
