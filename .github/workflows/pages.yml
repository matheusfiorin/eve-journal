name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  # Superseded PR runs can go; a deploy from main always finishes (a cancelled one can leave the backend and site out of step).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    name: Check application and data protection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  deploy-backend:
    name: Deploy EVE Cloudflare backend
    environment: github-pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.backend.outputs.url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci
      - name: Verify deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVE_CLIENT_SECRET: ${{ secrets.EVE_CLIENT_SECRET }}
        run: node scripts/check-cloudflare.mjs
      - name: Provision database and deploy Worker
        id: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVE_CLIENT_SECRET: ${{ secrets.EVE_CLIENT_SECRET }}
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional background push for the Android app (docs/FIREBASE_SETUP.md); the deploy sets them as Worker secrets when both exist.
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: node scripts/deploy-backend.mjs
  prepare-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [verify, deploy-backend]
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    outputs:
      artifact-name: pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Configure Pages (enable Settings → Pages → GitHub Actions first)
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Configure the deployed backend URL
        env:
          BACKEND_URL: ${{ needs.deploy-backend.outputs.url }}
        run: node scripts/configure-frontend.mjs
      - name: Prepare public application files
        run: mkdir _site && cp index.html app.js model.js fit.js orders.js market.js industry.js blueprints.js colonies.js standings.js mining.js exploration.js hauling.js sell.js jobs.js capabilities.js map.js mapview.js route.js storage.js backend.js config.json manifest.webmanifest _site/ && cp -r ui styles icons _site/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: prepare-pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: ${{ needs.prepare-pages.outputs.artifact-name }}
  verify-published:
    name: Test published site and live EVE APIs
    needs: [deploy, deploy-backend]
    env:
      EVE_BACKEND_URL: ${{ needs.deploy-backend.outputs.url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:live
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: live-site-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
