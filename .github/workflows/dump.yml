name: dump
on: {push: {branches: [tmp-dump]}}
permissions: {contents: write}
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: |
          mkdir -p dump
          npm i --no-save playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          node check.mjs || echo FAILED >> dump/live.txt
          git config user.name dump; git config user.email dump@example.com
          git add dump && git commit -qm "[skip ci] dump" && git push -q
