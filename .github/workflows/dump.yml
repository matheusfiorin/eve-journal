name: dump
on: {push: {branches: [tmp-dump]}}
permissions: {contents: write}
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p dump
          for u in https://api.eve-scout.com/v2/public/signatures https://api.eve-scout.com/v2/public/routes/signatures?from=Jita; do
            echo "== $u" >> dump/scout.txt
            curl -sS -D - -H 'Origin: https://matheusfiorin.github.io' -H 'User-Agent: eve-journal (github.com/matheusfiorin/eve-journal)' "$u" | head -c 2500 >> dump/scout.txt; echo >> dump/scout.txt
          done
          git config user.name dump; git config user.email dump@example.com
          git add dump && git commit -qm "[skip ci] dump" && git push -q
