name: dump
on: {push: {branches: [tmp-dump]}}
permissions: {contents: write}
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p dump
          python3 dump.py || echo FAILED >> dump/zkill.txt
          git config user.name dump; git config user.email dump@example.com
          git add dump && git commit -qm "[skip ci] dump" && git push -q
