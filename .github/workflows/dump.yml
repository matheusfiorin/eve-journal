name: dump
on: {push: {branches: [tmp-dump]}}
permissions: {contents: write}
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p dump
          curl -sSf https://eve-journal-api.eve-pilots-f6933080.workers.dev/api/market | python3 -c "import json,sys; d=json.load(sys.stdin); json.dump(d['universe'], open('dump/universe.json','w'))"
          git config user.name dump; git config user.email dump@example.com
          git add dump && git commit -qm "[skip ci] dump" && git push -q
